---
# Runs on a version tag pushed by `cz bump` + `git push --follow-tags`: builds the signed APK
# and AAB and publishes them as a GitHub release, with the notes from CHANGELOG.md.
name: Release
on:
  push:
    tags: [v*]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, which only v* tags may deploy from.
    environment: release
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # No Gradle cache: a release must not build from state other workflows wrote.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-disabled: true
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog: from its heading to the next one.
          awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          cp app/build/outputs/apk/release/app-release.apk "esp-flasher-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "esp-flasher-$version.aab"
          gh release create "$GITHUB_REF_NAME" "esp-flasher-$version.apk" "esp-flasher-$version.aab" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
